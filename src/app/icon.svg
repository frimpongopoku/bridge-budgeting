<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark background matching app theme -->
  <rect width="32" height="32" rx="7" fill="#0D0D1A"/>

  <!-- Bridge arch: two pillars connected by a curved arch -->
  <path
    d="M 7 26 L 7 17 Q 16 6.5 25 17 L 25 26"
    stroke="#C8A84B"
    stroke-width="2.5"
    fill="none"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Bridge deck / road line -->
  <line
    x1="4" y1="26"
    x2="28" y2="26"
    stroke="#C8A84B"
    stroke-width="2.5"
    stroke-linecap="round"
  />

  <!-- Subtle vertical suspender cables for depth -->
  <line x1="12" y1="26" x2="12" y2="19.5" stroke="#C8A84B" stroke-width="1" stroke-linecap="round" opacity="0.55"/>
  <line x1="16" y1="26" x2="16" y2="17.5" stroke="#C8A84B" stroke-width="1" stroke-linecap="round" opacity="0.55"/>
  <line x1="20" y1="26" x2="20" y2="19.5" stroke="#C8A84B" stroke-width="1" stroke-linecap="round" opacity="0.55"/>
</svg>
